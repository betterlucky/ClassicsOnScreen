services:
  web:
    build:
      context: .
      args:
        - HOST_UID=${HOST_UID:-1000}  # Pass host user ID to Dockerfile
    volumes:
      - ./db:/app/db:rw  # Add explicit read-write permission
      - static_volume:/app/staticfiles:rw
      - /etc/classicsonscreen/env.py:/etc/classicsonscreen/env.py:ro  # Mount only the environment file as read-only
      - ./env_loader.py:/app/env_loader.py:ro  # Mount the env_loader.py file
    environment:
      - DJANGO_DB_PATH=/app/db/db.sqlite3
      - STATIC_ROOT=/app/staticfiles
      - HOST_UID=${HOST_UID:-1000}  # Make HOST_UID available in container
    restart: on-failure

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt # Mount Let's Encrypt certificates
      - static_volume:/app/staticfiles # Mount static files at the same path as in the Nginx config
      - /etc/classicsonscreen/env.py:/etc/classicsonscreen/env.py:ro  # Mount env.py to read production value
      - ./env_loader.py:/app/env_loader.py:ro  # Mount the env_loader.py file
    depends_on:
      - web

volumes:
  static_volume:
    driver: local  # For storing static files
    name: static_volume  # Add explicit name
  sqlite_data:
    driver: local  # For storing database files
    name: sqlite_data  # Add explicit name
