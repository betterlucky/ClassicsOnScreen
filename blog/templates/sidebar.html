<!-- Simple vertical navigation -->
<nav id="sidebarMenu" class="sidebar">
    <div class="position-sticky pt-3">
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="{% url 'index' %}">
                    <i class="bi bi-house-door"></i>
                    <span>Home</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.path == '/films/' %}active{% endif %}" href="{% url 'film_list' %}">
                    <i class="bi bi-film"></i> <span>Films</span>
                </a>
            </li>
            {% if user.is_authenticated %}
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'create_show' %}">
                        <i class="bi bi-calendar-plus"></i> <span>Create A New Event</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'profile' user.username %}">
                        <i class="bi bi-person-circle"></i> <span>View Your Profile</span>
                    </a>
                </li>
                <li class="nav-item">
                    <form method="post" action="{% url 'buy_credits' %}" 
                          hx-post="{% url 'buy_credits' %}" 
                          hx-swap="none"
                          hx-on::after-request="window.location.reload()">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-link nav-link">
                            <i class="bi bi-cash-coin"></i> <span>Buy 10 Credits</span>
                        </button>
                    </form>
                </li>
                <li class="nav-item">
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-link nav-link">
                            <i class="bi bi-box-arrow-in-left"></i> <span>Logout</span>
                        </button>
                    </form>
                </li>
            {% else %}
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'login' %}">
                        <i class="bi bi-box-arrow-in-right"></i> <span>Login</span>
                    </a>
                </li>
            {% endif %}
            {% if user.is_staff %}
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'admin:index' %}">
                        <i class="bi bi-shield-lock"></i> <span>Admin</span>
                    </a>
                </li>
            {% endif %}
            
            <!-- Info links available to all users -->
            <li class="nav-item">
                <a href="{% url 'contact' %}" class="nav-link {% if request.path == '/contact/' %}active{% endif %}">
                    <i class="bi bi-envelope"></i>
                    <span>Contact Us</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{% url 'blog_faq' %}">
                    <i class="bi bi-question-circle"></i> <span>FAQ</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{% url 'blog_about' %}">
                    <i class="bi bi-info-circle"></i> <span>About Us</span>
                </a>
            </li>
        </ul>
    </div>
</nav>
